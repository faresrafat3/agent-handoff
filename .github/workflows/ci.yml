name: gate

# This repository uses its own standard on itself. If `doctor --strict` fails
# here, a real invariant broke — it is not a stale test to be adjusted.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the gates read git history; a shallow clone
                                # must be reported as shallow, not as broken

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test suite
        run: python3 -B -m unittest discover -s tests -v

      # The zero-dependency claim is only worth something if it is enforced.
      # `python3 -S` skips site-packages entirely, so this job runs the whole
      # suite with no third-party package importable at all. It is the job that
      # would have caught the original `pyyaml` + `jsonschema` dependency, which
      # is why it exists rather than a comment claiming there are none.
      - name: Confirm no third-party package is even importable
        run: |
          set -euo pipefail
          for pkg in yaml jsonschema; do
            if python3 -S -c "import $pkg" 2>/dev/null; then
              echo "::error::$pkg is importable under python3 -S; the dependency-free job below is not a real test"
              exit 1
            fi
            echo "ok  $pkg absent under python3 -S"
          done

      - name: Test suite with no site-packages
        run: python3 -S -B -m unittest discover -s tests -v

      - name: The gate and the suite, with no site-packages
        run: |
          set -euo pipefail
          python3 -S -B bin/agent-handoff conformance
          python3 -S -B bin/agent-handoff doctor --strict

      - name: The standard on this repository
        run: python3 -B bin/agent-handoff doctor --strict

      - name: Published conformance suite
        run: python3 -B bin/agent-handoff conformance

      - name: The demo asserts every claim it prints
        run: ./demo/demo.sh

      - name: Conformance suite through this action
        uses: ./
        with:
          mode: conformance

      - name: The action gates this repo on itself
        uses: ./
        with:
          mode: doctor
          vendor: false
